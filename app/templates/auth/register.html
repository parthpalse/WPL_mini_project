{% extends "base.html" %}
{% block title %}Create Account - BankEase{% endblock %}
{% block content %}
<div style="max-width:440px; margin:40px auto;">
    <div class="card" style="padding:32px;">
        <div style="text-align:center; margin-bottom:24px;">
            <div style="font-size:2rem; margin-bottom:6px;">✨</div>
            <h2 style="font-size:1.5rem; font-weight:800; color:var(--text);">Create an Account</h2>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Start planning your financial future with smart math</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="new-password">
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="padding:12px; font-size:1rem; margin-bottom:18px;">
                Register
            </button>
            <div style="text-align:center; font-size:0.88rem; color:var(--text-muted);">
                Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight:600;">Sign in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
